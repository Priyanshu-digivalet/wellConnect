services:
  postgres:
    image: postgres:16-alpine
    container_name: wellconnect-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: wellconnect
      POSTGRES_PASSWORD: wellconnect
      POSTGRES_DB: wellconnect
    volumes:
      - wellconnect_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellconnect -d wellconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wellconnect_pg:
